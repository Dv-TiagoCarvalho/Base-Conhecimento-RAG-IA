services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: conhecimento
      POSTGRES_USER: conhecimento
      POSTGRES_PASSWORD: conhecimento
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conhecimento -d conhecimento"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"   # painel em http://localhost:15672 (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - modelos-ollama:/root/.ollama

  # Baixa os modelos uma vez e encerra (embeddings + modelo que responde, ~2,3 GB no total)
  ollama-baixar-modelo:
    image: ollama/ollama
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 5 && ollama pull nomic-embed-text && ollama pull qwen2.5:3b"]

  app:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/conhecimento
      RABBITMQ_HOST: rabbitmq
      OLLAMA_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ollama-baixar-modelo:
        condition: service_completed_successfully

volumes:
  dados-postgres:
  modelos-ollama:
