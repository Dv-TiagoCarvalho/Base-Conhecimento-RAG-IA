name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Roda testes unitários e de integração (Testcontainers usa o Docker do próprio runner)
      - name: Compilar e testar
        run: mvn -B verify
